
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کلاس قرآن</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px 15px;min-height:100vh;
 display:flex;align-items:center;justify-content:center;
 font-family:Tahoma,sans-serif;background:#f1f5f0;color:#263b30
}
main{width:100%;max-width:460px;text-align:center}
header{background:#123f31;color:white;padding:30px 20px;border-radius:20px 20px 0 0}
.moon{font-size:36px;color:#d5ad55}
h1{margin:10px 0;font-size:28px}
.desc{font-size:13px;line-height:2;color:#e1eae3}
.schedule{display:inline-block;margin-top:15px;padding:10px 15px;border:1px solid #d5ad55;border-radius:30px;color:#f1d995;font-size:12px}
.card{background:#fffdf8;padding:25px 22px;border-radius:0 0 20px 20px;box-shadow:0 12px 35px #123f3115}
h2{font-size:19px;color:#123f31}
.hint{font-size:12px;color:#718078}
.roles{display:flex;gap:8px;margin:20px 0}
.role{flex:1;padding:12px 3px;border:1px solid #dce5dc;border-radius:10px;background:#f8faf6;color:#456052;font-family:inherit;cursor:pointer}
.role span{display:block;font-size:20px;margin-bottom:5px}
.role.active{border:2px solid #d5ad55;background:#fbf5e6}
label{display:block;text-align:right;font-size:12px;margin:13px 0 7px}
input{width:100%;height:46px;padding:10px;border:1px solid #dce3db;border-radius:9px;font-family:inherit;font-size:13px}
.submit,.attendance{
 width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;
 background:#123f31;color:white;font-family:inherit;font-size:14px;cursor:pointer
}
.attendance{background:#1c704d}
.attendance:disabled{background:#8b9b91;cursor:not-allowed}
.panel{display:none}
.notice{font-size:12px;color:#98702a;line-height:2}
footer{font-size:11px;color:#89958c;margin-top:15px}
</style>
</head>
<body>
<main>
<header>
 <div class="moon">☪</div>
 <h1>کلاس قرآن</h1>
 <p class="desc">سامانه مدرن مدیریت کلاس، حضور و غیاب و دسترسی به فعالیت‌ها و مطالب آموزشی.</p>
 <div class="schedule">چهارشنبه‌ها ۷ تا ۹ شب | کلاس قرآن</div>
</header>

<section class="card" id="loginPanel">
 <h2>ورود به سامانه 👋</h2>
 <p class="hint">نوع کاربری خود را انتخاب کنید.</p>

 <div class="roles">
  <button class="role active" type="button" data-role="student"><span>👨‍🎓</span>دانش‌آموز</button>
  <button class="role" type="button" data-role="teacher"><span>👨‍🏫</span>مربی</button>
  <button class="role" type="button" data-role="admin"><span>🛡️</span>مدیر</button>
 </div>

 <form id="login">
  <label for="username">نام کاربری</label>
  <input id="username" required placeholder="نام کاربری خود را وارد کنید">
  <label for="password">رمز عبور</label>
  <input id="password" type="password" required placeholder="رمز عبور خود را وارد کنید">
  <button class="submit" type="submit">ورود به پنل</button>
  <p id="message" class="notice"></p>
 </form>
</section>

<section class="card panel" id="studentPanel">
 <h2>پنل دانش‌آموز 👨‍🎓</h2>
 <p id="welcome"></p>
 <p class="hint">برای ثبت حضور خود در کلاس، دکمه زیر را بزن.</p>
 <button class="attendance" id="attendanceButton">ثبت حضور من</button>
 <p id="attendanceMessage" class="notice"></p>
 <button class="submit" id="logout">خروج از حساب</button>
</section>

<footer>سامانه مدیریت کلاس قرآن</footer>
</main>

<script>
let selectedRole="student";

document.querySelectorAll(".role").forEach(button=>{
 button.addEventListener("click",()=>{
  selectedRole=button.dataset.role;
  document.querySelectorAll(".role").forEach(item=>{
   item.classList.toggle("active",item===button);
  });
 });
});

document.getElementById("login").addEventListener("submit",event=>{
 event.preventDefault();

 const username=document.getElementById("username").value.trim();

 if(selectedRole!=="student"){
  document.getElementById("message").textContent=
   "پنل این نقش هنوز آماده نشده است.";
  return;
 }

 document.getElementById("loginPanel").style.display="none";
 document.getElementById("studentPanel").style.display="block";
 document.getElementById("welcome").textContent=
  "خوش آمدی، "+username+" عزیز!";
});

document.getElementById("attendanceButton").addEventListener("click",()=>{
 const now=new Date();
 document.getElementById("attendanceMessage").textContent=
  "حضور نمایشی شما ثبت شد: "+now.toLocaleDateString("fa-IR")+" ساعت "+
  now.toLocaleTimeString("fa-IR");
 document.getElementById("attendanceButton").disabled=true;
 document.getElementById("attendanceButton").textContent="حضور ثبت شد ✓";
});

document.getElementById("logout").addEventListener("click",()=>{
 document.getElementById("studentPanel").style.display="none";
 document.getElementById("loginPanel").style.display="block";
 document.getElementById("attendanceButton").disabled=false;
 document.getElementById("attendanceButton").textContent="ثبت حضور من";
 document.getElementById("attendanceMessage").textContent="";
 document.getElementById("login").reset();
});
</script>
</body>
</html>
